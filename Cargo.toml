[package]
name = "roform"
description = "Parse Roblox files into a render-agnostic intermediate representation"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
colored = "3.1.1"
mhif = { version = "0.4.0", default-features = false }
rbx_dom_weak = "4.2"
rbx_binary = "3.0"
rbx_mesh = { git = "https://github.com/evilbocchi/rbx_mesh", rev = "4d0f89203d6e4356ffa49b111d4db68953dee043" }
rbx_reflection_database = "3.0"
rbx_types = "3.1"
rbx_xml = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
